version: '3.8'

services:
  investigation-service:
    build: .
    ports:
      - "8082:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: 123456
      KAFKA_HOST: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - kafka
      - redis

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: crime_system
    ports:
      - "3306:3306"

  redis:
    image: redis
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

  zookeeper:
    image: bitnami/zookeeper
    ports:
      - "2181:2181"

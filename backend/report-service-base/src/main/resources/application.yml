server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/report_services
    username: root
    password: # Nếu có password thì thêm vào đây
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

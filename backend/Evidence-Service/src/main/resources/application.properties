spring.application.name=Evidence-Service

# Internal API key
internal.api-key=api-key

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/Evidence_Service
spring.datasource.username=root
spring.datasource.password=10092412
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Kafka
spring.kafka.bootstrap-servers=103.112.210.245:9092
spring.kafka.consumer.group-id=evidence-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.docker.compose.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

report-service.url=http://report-service:8080
suspect-service.url=http://suspect-service:8080
warrant-service.url=http://warrant-service:8080
case-service.url=http://case-service:8080

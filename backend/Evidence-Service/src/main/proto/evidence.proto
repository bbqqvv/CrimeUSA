service EvidenceService {
  rpc GetEvidenceById(EvidenceRequest) returns (EvidenceDto);
  rpc GetEvidencesByCase(CaseRequest) returns (EvidenceList);
  rpc GetEvidencesBySuspect(SuspectRequest) returns (EvidenceList);
}

message EvidenceRequest {
  string evidenceId = 1;
}

message EvidenceDto {
  string evidenceId = 1;
  string description = 2;
  string collectedBy = 3;
  string fileUrl = 4;
  string status = 5;
}
